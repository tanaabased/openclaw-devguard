name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  release-npm:
    name: Publish npm package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    env:
      TERM: xterm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Set up Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Set up Node
        uses: tanaabased/actions/setup-node@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate source
        run: |
          bun run lint
          bun run typecheck
          bun run test
          bun run plugin:check
      - name: Prepare and synchronize release
        uses: tanaabased/actions/publish-repo@v1
        with:
          commands: |
            version-injector openclaw.plugin.json --style json --version "${{ github.event.release.tag_name }}"
            bun run format:write
          sync-token: ${{ secrets.TANAAB_COAXIUM_INJECTOR }}
      - name: Validate prepared package
        run: |
          bun run build
          bun run format:check
      - id: package
        name: Pack plugin package
        uses: tanaabased/actions/npm-pack@v1
      - name: Validate packed plugin package
        env:
          DEVGUARD_PACKAGE: ${{ steps.package.outputs.tarball-path }}
        run: bun run test:release
      - name: Publish package to npm
        uses: tanaabased/actions/publish-npm@v1
        with:
          access: public
          channel-token: ${{ secrets.TANAAB_NPM_DEPLOY }}
          prerelease-tag: edge
          stable-tag: latest
          tarball: ${{ steps.package.outputs.tarball-path }}
          update-prerelease-tag-on-stable: true

  release-clawhub:
    name: Publish ClawHub package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TERM: xterm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Set up Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Set up Node
        uses: tanaabased/actions/setup-node@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate source
        run: |
          bun run lint
          bun run typecheck
          bun run test
          bun run plugin:check
      - name: Prepare release
        uses: tanaabased/actions/prepare-release@v1
        with:
          version: ${{ github.event.release.tag_name }}
          commands: |
            version-injector openclaw.plugin.json --style json --version "${{ github.event.release.tag_name }}"
            bun run format:write
      - name: Validate prepared package
        run: |
          bun run build
          bun run format:check
      - id: package
        name: Pack plugin package
        uses: tanaabased/actions/npm-pack@v1
      - name: Validate packed plugin package
        env:
          DEVGUARD_PACKAGE: ${{ steps.package.outputs.tarball-path }}
        run: bun run test:release
      - name: Publish package to ClawHub
        uses: tanaabased/actions/publish-clawhub@v1
        with:
          clawhub-token: ${{ secrets.TANAAB_LOBSTER_BOAT }}
          owner: tanaab
          source-commit: ${{ github.sha }}
          source-repo: ${{ github.repository }}
          tags: ${{ github.event.release.prerelease && 'edge' || 'latest,edge' }}
          tarball: ${{ steps.package.outputs.tarball-path }}
