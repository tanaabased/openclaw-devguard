name: Live model test

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI provider/model reference
        required: true
        default: openai/gpt-4.1-mini
        type: string

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  STAMPED_VERSION: v9.9.9-live.${{ github.sha }}

jobs:
  model:
    name: model (macos-26, live)
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify live credential
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.TANAAB_ALTERNATE_MALE_KEY }}
        run: test -n "$OPENAI_API_KEY"
      - name: Install Homebrew dependencies
        shell: bash
        run: |
          brew bundle --file "$GITHUB_WORKSPACE/Brewfile" --no-upgrade
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Prepare release-shaped build
        uses: tanaabased/prepare-release-action@v1
        with:
          version: ${{ env.STAMPED_VERSION }}
          sync: false
          commands: |
            version-injector openclaw.plugin.json --style json --version "${{ env.STAMPED_VERSION }}"
            bun run build
      - name: Pack prepared plugin
        shell: bash
        run: |
          bun run plugin:check
          bun run format:check
          archive_name="$(npm pack --silent --pack-destination "$RUNNER_TEMP")"
          test -n "$archive_name"
          echo "DEVGUARD_PACKAGE=$RUNNER_TEMP/$archive_name" >> "$GITHUB_ENV"
      - name: Run Leia-backed model example
        shell: bash
        env:
          DEVGUARD_HOME: ${{ github.workspace }}/examples/model/.tmp/devguard-home
          DEVGUARD_LIVE_MODEL: ${{ inputs.model }}
          NO_COLOR: '1'
          OPENAI_API_KEY: ${{ secrets.TANAAB_ALTERNATE_MALE_KEY }}
          OPENCLAW_SKIP_CHANNELS: '1'
          OPENCLAW_STATE_DIR: ${{ github.workspace }}/examples/model/.tmp/openclaw
          TMPDIR: ${{ github.workspace }}/examples/model/.tmp
        run: |
          mkdir -p "$TMPDIR"
          bun run leia examples/model/README.md --stdin --retry 0
