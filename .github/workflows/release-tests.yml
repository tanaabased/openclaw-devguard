name: Release tests

on:
  pull_request:

permissions:
  contents: read

env:
  STAMPED_VERSION: v9.9.9-ci.${{ github.event.pull_request.head.sha }}

jobs:
  release-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Set up Node
        uses: tanaabased/actions/setup-node@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Prepare synthetic release
        uses: tanaabased/actions/publish-repo@v1
        with:
          commands: |
            version-injector openclaw.plugin.json --style json --version "${{ env.STAMPED_VERSION }}"
          dry-run: true
          release-date: '2000-01-01T00:00:00Z'
          release-url: https://github.com/${{ github.repository }}/releases/tag/${{ env.STAMPED_VERSION }}
          version: ${{ env.STAMPED_VERSION }}
      - name: Validate prepared package
        run: |
          bun run build
          bun run format:check
      - id: package
        name: Pack plugin package
        uses: tanaabased/actions/npm-pack@v1
      - name: Run release package tests
        env:
          DEVGUARD_PACKAGE: ${{ steps.package.outputs.tarball-path }}
        run: bun run test:release
      - name: Validate npm publish
        uses: tanaabased/actions/publish-npm@v1
        with:
          access: public
          dry-run: true
          prerelease-tag: edge
          stable-tag: latest
          tarball: ${{ steps.package.outputs.tarball-path }}
      - name: Validate ClawHub publish
        uses: tanaabased/actions/publish-clawhub@v1
        with:
          dry-run: true
          owner: tanaab
          source-commit: ${{ github.event.pull_request.head.sha }}
          source-repo: ${{ github.repository }}
          tags: edge
          tarball: ${{ steps.package.outputs.tarball-path }}
